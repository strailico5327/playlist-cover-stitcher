[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist-cover-stitcher"
version = "0.1.0"
description = "Create a 1000x1000 playlist cover PNG from four square-cropped images."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
    { name = "Strai" }
]
dependencies = [
    "Pillow",
    "PySide6"
]

[project.scripts]
playlist-cover-stitcher = "playlist_cover_stitcher.app:main"

[tool.setuptools.packages.find]
where = ["src"]
